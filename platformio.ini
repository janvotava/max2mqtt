; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
upload_protocol = espota
upload_port = max.lan
monitor_port = socket://nix.lan:5000
monitor_speed = 115200
build_type = debug
monitor_filters = esp8266_exception_decoder
lib_deps =
	knolleary/PubSubClient@^2.8.0
	bblanchon/ArduinoJson@^6.16.1
	https://github.com/janvotava/NTP.git

; Board whose CC1101 module is off frequency, see docs/cc1101-shield.md.
; The number is specific to one module: measure it with the cc1101_check env.
[env:d1_mini_shield]
extends = env:d1_mini
build_flags = -DCC1101_FREQ_OFFSET=45

; Radio check tool (src/cc1101_check.cpp) instead of the firmware. Flashed over USB:
;   pio run -e cc1101_check -t upload && pio device monitor -e cc1101_check
[env:cc1101_check]
platform = espressif8266
board = d1_mini
framework = arduino
build_flags = -DCC1101_CHECK
build_src_filter = -<*> +<CC1101.cpp> +<MaxCC1101.cpp> +<cc1101_check.cpp>
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
