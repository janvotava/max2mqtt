[package]
name = "max2mqtt"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "eQ-3 MAX! to MQTT bridge with burner control, for D1-mini-sized ESP32 boards + CC1101"
publish = false

[[bin]]
name = "max2mqtt"
path = "src/main.rs"
test = false
bench = false

# Board (and with it the chip). Exactly one. See src/board.rs for the pins.
[features]
default = ["c3-mini"]
# Lolin C3 Mini, ESP32-C3 (RISC-V, standard Rust toolchain).
c3-mini = [
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-storage/esp32c3",
    "esp-println/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-alloc/esp32c3",
    "esp-radio/esp32c3",
]
# D1-mini-sized ESP32-WROOM-32 boards: MH-ET Live MiniKit and clones such as HW-665
# (Xtensa, needs the `esp` toolchain from espup; build with `cargo build-esp32`).
d1-mini-esp32 = [
    "esp-hal/esp32",
    "esp-rtos/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-storage/esp32",
    "esp-println/esp32",
    "esp-backtrace/esp32",
    "esp-alloc/esp32",
    "esp-radio/esp32",
]

[dependencies]
max2mqtt-bridge = { path = "../bridge" }

esp-hal = { version = "~1.2.2", features = ["unstable", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["esp-radio", "esp-alloc", "embassy", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04"] }
esp-storage = { version = "0.10.0", features = ["embedded-storage"] }
esp-println = { version = "0.18.0", features = ["log-04"] }
# Only for capturing backtraces: the panic handler is ours (src/crash.rs).
esp-backtrace = { version = "0.20.0", default-features = false, features = ["println"] }
esp-alloc = { version = "0.11.0", features = ["internal-heap-stats"] }
esp-radio = { version = "1.0.0-beta.1", features = ["wifi", "esp-alloc", "unstable", "log-04"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "tcp",
    "udp",
    "dns",
    "dhcpv4",
    "dhcpv4-hostname",
    "medium-ethernet",
    "proto-ipv4",
    "log",
] }

embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
heapless = { version = "0.9", default-features = false }
log = "0.4.27"
static_cell = "2.1.1"
critical-section = "1.2.0"
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
sequential-storage = { version = "8.0.2", features = ["alloc"] }
embedded-storage-async = "0.4.2"
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["proto-ipv4", "udp", "medium-ethernet"] }
edge-captive = { version = "0.8.0", default-features = false, features = ["io"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
embedded-storage = "0.3.2"
sha2 = { version = "0.11", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[build-dependencies]
flate2 = "1.1.11"
