# Optional. Copy to secrets.toml (git-ignored): defaults for the first boot, compiled into
# the firmware. Everything can also be set in the web UI later, which then takes precedence.
[env]
# Without these the board opens its setup hotspot.
# MAX_WIFI_SSID = "mywifi"
# MAX_WIFI_PASSWORD = "password"
# Web UI and hotspot password, 8-63 characters. Without it one is generated on the first
# boot and printed on the serial console at every boot.
# MAX_PASSWORD = "change me please"
# MAX_MQTT_USER = ""
# MAX_MQTT_PASSWORD = ""
# Topic prefix, e.g. for a second board next to the first.
# MAX_MQTT_PREFIX = "max"
# Home Assistant discovery, on unless "false".
# MAX_HOMEASSISTANT = "true"
# CC1101 crystal correction for this board's module, in steps of 1.587 kHz
# (see hardware/cc1101-shield/troubleshooting.md). The first shield's module needs 45.
# MAX_CC1101_FREQ_OFFSET = "45"
